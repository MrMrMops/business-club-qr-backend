services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: business_user
      POSTGRES_PASSWORD: business_password
      POSTGRES_DB: business_club

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U business_user -d business_club"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build: .
    env_file:
      - .env

    environment:
      DATABASE_URL: postgresql+asyncpg://business_user:business_password@db:5432/business_club

    command: alembic upgrade head

    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    env_file:
      - .env

    environment:
      DATABASE_URL: postgresql+asyncpg://business_user:business_password@db:5432/business_club

    ports:
      - "8000:8000"

    command:
      uvicorn app.main:app --host 0.0.0.0 --port 8000

    depends_on:
      migrate:
        condition: service_completed_successfully

  bot:
    build: .
    env_file:
      - .env

    environment:
      DATABASE_URL: postgresql+asyncpg://business_user:business_password@db:5432/business_club

    command: python -m app.bot.bot

    depends_on:
      migrate:
        condition: service_completed_successfully


volumes:
  postgres_data: